<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pakar Penyakit Kulit</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .navbar {
            background-color: #ffffff;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
        }

        .hero-section {
            text-align: center;
            padding: 50px 20px;
        }

        .hero-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-color: #e9ecef;
            border: 2px solid #ccc;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .form-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }

        /* Menyembunyikan semua section kecuali yang aktif */
        .page-section {
            display: none;
        }

        .page-section.active {
            display: block;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Penyakit Kulit</a>
            <div class="d-flex">
                <button class="btn btn-outline-primary me-2" onclick="showPage('home')">Home</button>
                <button class="btn btn-primary me-2" onclick="showPage('konsultasi')">Konsultasi</button>
                <button class="btn btn-outline-secondary" onclick="showPage('login')">Login Admin</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">

        <div id="home" class="page-section active">
            <div class="hero-section">
                <h2>Selamat Datang di Sistem Pakar Penyakit Kulit</h2>
                <p class="text-muted">Sistem ini membantu mengenali penyakit kulit berdasarkan gejala yang Anda rasakan.
                </p>
                <div class="hero-image">
                    <span class="text-muted">Logo</span>
                </div>
                <button class="btn btn-primary btn-lg mt-3" onclick="showPage('konsultasi')">Mulai Konsultasi</button>
            </div>
        </div>

        <div id="konsultasi" class="page-section">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="form-container">
                        <h4 class="mb-4 border-bottom pb-2">Masukan Data Pasien</h4>
                        <form>
                            <div class="mb-3">
                                <label class="form-label">Nama Pasien</label>
                                <input type="text" class="form-control" placeholder="Masukkan nama Anda">
                            </div>
                            <div class="mb-3 d-flex align-items-center">
                                <label class="form-label me-3 mb-0">Jenis Kelamin:</label>
                                <div class="form-check me-3">
                                    <input class="form-check-input" type="radio" name="gender" id="pria">
                                    <label class="form-check-label" for="pria">Pria</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="gender" id="wanita">
                                    <label class="form-check-label" for="wanita">Wanita</label>
                                </div>
                            </div>
                            <div class="mb-4 border-bottom pb-4">
                                <label class="form-label">Umur</label>
                                <input type="number" class="form-control" placeholder="Masukkan umur Anda">
                            </div>

                            <h4 class="mb-3 text-center">Gejala Yang Dialami</h4>
                            <div class="mb-3">
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" id="g01">
                                    <label class="form-check-label" for="g01">Muncul benjolan berisi nanah (G01)</label>
                                </div>
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" id="g08">
                                    <label class="form-check-label" for="g08">Kulit kemerahan yang melebar (G08)</label>
                                </div>
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" id="g22">
                                    <label class="form-check-label" for="g22">Gatal yang cukup mengganggu (G22)</label>
                                </div>
                            </div>

                            <div class="text-end mt-4">
                                <button type="button" class="btn btn-primary px-4">Diagnosa</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div id="login" class="page-section">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="form-container">
                        <h5 class="text-center mb-1">SISTEM PAKAR PENYAKIT KULIT</h5>
                        <p class="text-center text-muted mb-4">Login Sebagai Admin</p>

                        <form>
                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <input type="text" class="form-control">
                            </div>
                            <div class="mb-1 text-end">
                                <a href="#" class="text-decoration-none small text-muted">Forget Password?</a>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control">
                            </div>
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe">
                                <label class="form-check-label" for="rememberMe">Remember Me</label>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">MASUK</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        function showPage(pageId) {
            // Sembunyikan semua section
            const sections = document.querySelectorAll('.page-section');
            sections.forEach(section => {
                section.classList.remove('active');
            });

            // Tampilkan section yang dipilih
            document.getElementById(pageId).classList.add('active');
        }
    </script>
</body>

</html>
